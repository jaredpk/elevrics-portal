<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Elevrics Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- chrome.css first: it owns the token values and the rail, and is the
     same sheet injected into the proxied modules. portal.css builds on it. -->
<link rel="stylesheet" href="/css/chrome.css">
<link rel="stylesheet" href="/css/portal.css">
</head>
<body>

<!-- Filled by the Worker from the registry in src/modules.js. Don't hand-write
     nav links here: there are two pages carrying this and they drifted. -->
<nav class="elv-rail" aria-label="Portal" data-portal-nav></nav>

<header class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow">Elevrics Internal</p>
    <div class="hero-rule"></div>
    <h1>Portal</h1>
    <p class="hero-sub">Internal tools, one account. Sign-in is handled by the
       portal — every module below verifies the same signed assertion
       independently.</p>
  </div>
</header>

<main>

  <section class="section">
    <p class="section-label">Modules</p>
    <!-- Also registry-driven — a module's blurb and stack line live in
         src/modules.js, next to the origin they describe. -->
    <div class="card-grid" data-portal-cards></div>
  </section>

</main>

<footer>Elevrics internal · not indexed · sign-in required</footer>

</body>
</html>
