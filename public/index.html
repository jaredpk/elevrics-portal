<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Elevrics Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/portal.css">
</head>
<body>

<!-- Filled by the Worker from the registry in src/modules.js. Don't hand-write
     nav links here: there are two pages carrying this and they drifted. -->
<nav data-portal-nav></nav>

<main>

  <div class="page-head">
    <h1>Portal</h1>
    <p>Internal tools, one login. Authentication is handled by Cloudflare Access
       at the edge — every module below verifies the same token independently.</p>
  </div>

  <section class="section">
    <p class="section-label">Modules</p>
    <!-- Also registry-driven — a module's blurb and stack line live in
         src/modules.js, next to the origin they describe. -->
    <div class="card-grid" data-portal-cards></div>
  </section>

</main>

<footer>Elevrics internal · not indexed · access controlled by Cloudflare Access</footer>

</body>
</html>
